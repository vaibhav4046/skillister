name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Static validation
        run: node test/validate.mjs
      - name: Prompt evals
        run: node test/eval.mjs
      - name: CLI smoke test
        run: |
          node bin/skilldex.mjs index
          node bin/skilldex.mjs packs
          node bin/skilldex.mjs route "the login page is broken"
          node bin/skilldex.mjs doctor
