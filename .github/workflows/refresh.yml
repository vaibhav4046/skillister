name: refresh

# Runs daily. Keeps the registry honest without anyone remembering to.
#
#  - re-audits every listed pack, so a pack that rots loses its score in public
#  - re-scans GitHub for packs that are not listed yet, verifying each really
#    ships SKILL.md files rather than merely mentioning skills in its README
#
# Measurements are facts, so fresh scores commit straight to main and the site
# is never stale. Promoting or demoting a pack is a judgement call, so drift is
# raised as an issue for a human instead. Curation is the product; an
# auto-merged firehose would recreate the problem this repository argues against.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-audit every listed pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/skillister.mjs bench --json > registry/benchmarks.json

      - name: Find packs not yet listed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover.mjs > candidates.md

      - name: Audit those candidates too
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/skillister.mjs bench --candidates --limit=25 --json > registry/candidate-scores.json

      - name: Flag anything that dropped below the bar
        run: node scripts/report-drift.mjs >> candidates.md

      - name: Verify the registry still passes
        run: node test/validate.mjs && node test/eval.mjs

      - name: Commit refreshed measurements
        run: |
          if git diff --quiet registry/; then echo "scores unchanged"; exit 0; fi
          git config user.name "skillister-bot"
          git config user.email "bot@users.noreply.github.com"
          git add registry/
          git commit -m "chore: daily registry refresh (scores, candidates)"
          git push origin HEAD:main

      - name: Raise an issue if the registry should change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the drift section matters here: it names packs that fell below
          # the bar and unlisted packs that cleared it. Both are judgement calls,
          # so they go to a human rather than being applied automatically.
          if ! grep -q "below the bar\|clear the bar" candidates.md; then
            echo "no drift to report"; exit 0
          fi
          title="Registry drift $(date +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "Registry drift in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file candidates.md
          else
            gh issue create --title "$title" --body-file candidates.md --label "registry"
          fi
